function parse(r) {
  if (r.indexOf("cat-") === 0) return { v: "cat", id: r.slice(4) };
  if (r.indexOf("card-") === 0) return { v: "card", id: Number(r.slice(5)) };
  if (r.indexOf("price-") === 0) return { v: "price", id: Number(r.slice(6)) };
  if (r === "owner") return { v: "owner" };
  if (r === "install") return { v: "install" };
  if (r === "news") return { v: "news" };
  if (r === "id") return { v: "id" };
  if (r === "help") return { v: "help" };
  if (r === "ask") return { v: "ask" };
  if (r === "apply") return { v: "apply" };
  return { v: "home" };
}
function valid(r) {

}

  if (document.getElementById("idm")) return;
  var el = document.createElement("div");
  el.className = "sheet-bg"; el.id = "idm";
  el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Ваш номер участника"><h2>Ваш номер участника</h2><div class="idbox"><div class="idbig">' + esc(id) + "</div></div>" +
    "<p>Сохраните его: сделайте снимок экрана. Номер нужен для розыгрыша призов.</p>" +
    '<button type="button" class="opt fill" data-copyid="1">Скопировать номер</button><button type="button" class="opt" data-idok="1">Понятно, сохранила</button></div>';
  document.body.appendChild(el);
}
function ensureId() {
  if (getId() || !isInstalled()) return;
  if (DEMO) { memId = "Б56-48213"; showIdModal(memId); refreshNewsUi(); return; }
  apiPost({ a: "reg", token: newToken(), role: getRole(), plat: detectPlat(), src: sget("b56_src") || qrSource() }).then(function (r) {
    if (r && r.ok && r.id) { sset("b56_id", r.id); memId = r.id; showIdModal(r.id); refreshNewsUi(); }
  }, function () {});
}
function currentOrg() {
  var p = parse(state.route);
  if (p.v === "card" || p.v === "price") return (itemById(p.id) || {}).name || "";
  return "";
}
function isStandalone() {
  try { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; } catch (e) { return false; }
}
function qrSource() {
  try { var p = new URLSearchParams(location.search).get("p"); return p === "android" || p === "iphone" ? p : ""; } catch (e) { return ""; }
}
function detectPlat() {
  var s = qrSource();
  if (s) return s;
  return /iPhone|iPad|iPod/i.test(navigator.userAgent || "") ? "iphone" : "android";
}
var deferredPrompt = null;
state.plat = detectPlat();

function trackRoute(r) {
  var p = parse(r);
  if (p.v === "card") track("card_open", { org: (itemById(p.id) || {}).name });
  else if (p.v === "price") track("price_open", { org: (itemById(p.id) || {}).name });
  else if (p.v === "owner") track("owner_info");
  else if (p.v === "news") track("news_open");
  else if (p.v === "install") track("install_howto");
  else if (p.v === "help") track("support_open");
}

function installBanner() {
  if (isStandalone()) return "";
  return '<div class="install"><div class="tt"><b>Поставьте приложение на телефон</b><span>Значок «Б-56» на экране и номер для розыгрыша призов</span></div>' +
    '<button type="button" data-go="install">Установить</button></div>';
}
function viewInstall() {
  var ios = state.plat === "iphone", steps, top = "";
  var seg = '<div class="seg" role="group" aria-label="Тип телефона">' +
    '<button type="button" data-plat="android" aria-pressed="' + (!ios) + '">Android</button>' +
    '<button type="button" data-plat="iphone" aria-pressed="' + ios + '">iPhone</button></div>';
  if (ios) {
    steps = [
      "Откройте эту страницу в браузере <b>Safari</b> (значок синего компаса). Если ссылка пришла в Telegram, ВКонтакте или WhatsApp, нажмите там <b>«Открыть в Safari»</b> (или скопируйте ссылку и вставьте в Safari).",
      'Нажмите внизу экрана кнопку <b>«Поделиться»</b> (квадрат со стрелкой вверх) <span class="ic">' + ico('<path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>', 24, "#14532D") + "</span>.",
      "Прокрутите меню вниз и выберите <b>«На экран „Домой“»</b>.",
      "Нажмите <b>«Добавить»</b> в правом верхнем углу. Значок «Б-56» появится на экране телефона."
    ];
  } else {
    if (deferredPrompt) top = '<button type="button" class="bigbtn" data-install="1">Установить приложение</button>';
    steps = [
      "Если вы открыли ссылку в Telegram, ВКонтакте или WhatsApp, нажмите там три точки <b>⋮</b> и выберите <b>«Открыть в браузере»</b> (или скопируйте ссылку кнопкой ниже и вставьте в браузер).",
      "Подойдёт любой обычный браузер: <b>Chrome, Яндекс Браузер, Samsung Internet, Opera, Firefox</b>.",
      "Нажмите в браузере кнопку меню: три точки <b>⋮</b> (у Samsung Internet три полоски <b>≡</b>).",
      "Выберите <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>. В разных браузерах название чуть отличается.",
      "Подтвердите. Значок «Б-56» появится на экране телефона."
    ];
  }
  return '<div class="app"><div class="row">' + backBtn("Назад") + "<h1>Установить приложение</h1></div>" + seg + top +
    '<ol class="how">' + steps.map(function (t) { return "<li><div>" + t + "</div></li>"; }).join("") + "</ol>" +
    '<button type="button" class="bigbtn" style="background:#fff;color:#14532D" data-copylink="1">Скопировать ссылку на приложение</button>' +
    '<div class="note">Приложение работает как обычное: значок на экране, открывается сразу, без магазина приложений. Не получается установить? Можно пользоваться и без установки, просто открывайте ссылку в браузере. Установка нужна для номера участника розыгрыша.</div>' +
    '<div class="foot">© 2026 «Бугуруслан всё в одном месте» · Б-56. Все права защищены</div></div>';
}

var roleAsked = false;
function askRole() {
  if (roleAsked || sget("b56_role")) return;
  roleAsked = true;
  var el = document.createElement("div");
  el.className = "sheet-bg"; el.id = "role";
  el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Кто вы"><h2>Кто вы?</h2><p>Один вопрос, чтобы показать вам нужное.</p>' +
    '<button type="button" class="opt fill" data-role="resident">Я житель Бугуруслана</button>' +
    '<button type="button" class="opt" data-role="owner">Я владелец бизнеса</button>' +
    '<button type="button" class="skip" data-role="skip">Пропустить</button></div>';
  document.body.appendChild(el);
}
function setRole(v) {
  var el = document.getElementById("role");
  if (el) el.remove();
  memRole = v;
  sset("b56_role", v);
  if (v === "resident" || v === "owner") track("role_" + v);
  if (v === "owner") go("owner");
  ensureId();
}

/* ---------- показ и переходы ---------- */
function render() {
  var r = parse(state.route), html, results = null;
  if (r.v === "cat") { var c = catById(r.id); html = viewCat(c); results = function (q) { return catResults(c, q); }; }
  else if (r.v === "card") html = viewCard(itemById(r.id));
  else if (r.v === "price") html = viewPrice(itemById(r.id));
  else if (r.v === "owner") html = viewOwner();
  else if (r.v === "install") html = viewInstall();
  else if (r.v === "news") html = viewNews();
  else if (r.v === "id") html = viewId();
  else if (r.v === "help") html = viewHelp();
  else if (r.v === "ask") html = viewForm("ask");
  else if (r.v === "apply") html = viewForm("owner");
  else { html = viewHome(); results = homeResults; }
  app.outerHTML = html;
  app = document.querySelector(".app");
  app.id = "app";
  if (results) {
    var box = document.getElementById("results"), q = document.getElementById("q");
    box.innerHTML = results("");
    q.addEventListener("input", function () { box.innerHTML = results(q.value); var tp = document.getElementById("top"); if (tp) tp.hidden = !!q.value.trim(); });
  }
  document.title = "Бугуруслан всё в одном месте";
  bindGallery();
  carSetup();
  if (r.v === "home") askRole();
  try { window.scrollTo(0, 0); } catch (e) {}
}
function bindGallery() {
  var g = document.getElementById("gal"), n = document.getElementById("galn");
  if (!g || !n) return;
  g.addEventListener("scroll", function () {
    var i = Math.round(g.scrollLeft / Math.max(1, g.clientWidth));
    n.textContent = (i + 1) + " / " + g.children.length;
  });
}
function setHash(r) { try { if (location.hash.slice(1) !== r) location.hash = r; } catch (e) {} }
function go(r) {
  if (!valid(r) || r === state.route) return;
  trackRoute(r);
  state.stack.push(state.route);
  state.route = r;
  setHash(r);
  render();
}
function back() {
  state.route = state.stack.length ? state.stack.pop() : "home";
  setHash(state.route);
  render();
}

document.addEventListener("click", function (e) {
  if (e.target.closest("[data-idok]")) { var m = document.getElementById("idm"); if (m) m.remove(); return; }
  var sd = e.target.closest("[data-send]");
  if (sd) { sendTicket(sd.getAttribute("data-send"), sd); return; }
  var cl = e.target.closest("[data-copylink]");
  if (cl) { var u = "https://buguruslan56.ru"; try { navigator.clipboard.writeText(u).then(function () { cl.textContent = "Ссылка скопирована ✓"; }, function () { cl.textContent = u; }); } catch (er) { cl.textContent = u; } return; }
  var cp = e.target.closest("[data-copyid]");
  if (cp) { try { navigator.clipboard.writeText(getId()).then(function () { cp.textContent = "Скопировано ✓"; }, function () {}); } catch (er) {} return; }
  var ro = e.target.closest("[data-role]");
  if (ro) { setRole(ro.getAttribute("data-role")); return; }
  var pl = e.target.closest("[data-plat]");
  if (pl) { state.plat = pl.getAttribute("data-plat"); render(); return; }
  var ins = e.target.closest("[data-install]");
  if (ins && deferredPrompt) {
    track("install_click");
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; render(); }, function () {});
    return;
  }
  var b = e.target.closest("[data-back]");
  if (b) { e.preventDefault(); back(); return; }
  var g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
  var a = e.target.closest("a[href]");
  if (a) {
    var h = a.getAttribute("href") || "", org = currentOrg();
    if (a.hasAttribute("data-k")) track("owner_contact");
    else if (h.indexOf("tel:") === 0) track("call_click", { org: org });
    else if (h.indexOf("yandex.ru/maps") !== -1) track("route_click", { org: org });
    else if (a.closest(".web")) track("link_click", { org: org });
  }
});
window.addEventListener("hashchange", function () {
  var r = location.hash.slice(1) || "home";
  if (r === state.route) return;
  if (!valid(r)) r = "home";
  if (state.stack.length && state.stack[state.stack.length - 1] === r) state.stack.pop(); else if (r !== "home") state.stack.push(state.route);
  state.route = r;
  render();
});

window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  deferredPrompt = e;
  if (parse(state.route).v === "install") render();
});
window.addEventListener("appinstalled", function () { sset("b56_inst", "1"); track("install"); });

(function start() {
  var r = "home";
  try { r = location.hash.slice(1) || "home"; } catch (e) {}
  loadPlaces();
  loadBanners();
  state.route = valid(r) ? r : "home";
  var src = qrSource();
  if (src) { if (!sget("b56_src")) sset("b56_src", src); track("qr_open"); }
  if (isStandalone()) {
    track("open_from_icon");
    if (!sget("b56_inst")) { sset("b56_inst", "1"); track("install"); }
  } else if (src && state.route === "home") {
    state.stack = ["home"];
    state.route = "install";
  }
  loadNews();
  render();
  if (getRole()) ensureId();
})();
</script>
