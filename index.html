<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Б-56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Бугуруслан всё в одном месте: магазины, сервисы и услуги города. Адрес, телефон и часы работы под рукой.">
<title>Бугуруслан всё в одном месте</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: фиксированный светлый вид по макету. Тёмно-зелёный бренд, золотой акцент, одна колонка до 480px. */
:root {
  --bg: #F2F7F3;
  --ink: #0B2417;
  --green: #14532D;
  --line: #CFE0D5;
  --rule: #E1EFE4;
  --muted: #4D6657;
  --gold: #FFD166;
  --mint: #DCEFE2;
  --white: #FFFFFF;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
a { color: inherit; text-decoration: none; }
button, input { font-family: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
label:focus-within { outline: 3px solid var(--green); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 20px; padding-block: 20px 96px; display: flex; flex-direction: column; gap: 16px; }
.app.home { padding-block-start: 28px; gap: 20px; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.back { flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: var(--white); border: 1px solid var(--line); }
h1 { margin: 0; font-size: 24px; font-weight: 800; }
h2 { margin: 0; font-size: 18px; font-weight: 800; }
.sub { font-size: 14px; color: var(--muted); }

.hero { display: flex; flex-direction: column; gap: 10px; }
.hero .row { gap: 14px; }
.hero h1 { font-size: 26px; line-height: 1.12; }
.hero p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--muted); }

.search { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; }
.home .search { height: 52px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink); }
.search input::placeholder { color: #6C8473; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 8px 10px; background: var(--white); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; text-align: left; cursor: pointer; }
.tile.on { background: var(--green); color: var(--white); border-color: var(--green); }
.tile .ic { display: flex; align-items: center; justify-content: center; flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--mint); }
.tile.on .ic { background: rgba(255,255,255,.2); }
.tile .tx { font-size: 13px; font-weight: 800; line-height: 1.2; min-width: 0; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
@media (max-width: 389px) { .tile .tx { font-size: 12px; } }
@media (max-width: 369px) { .tile .tx { font-size: 11.5px; } }

.list { display: flex; flex-direction: column; gap: 12px; }
.org { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--white); border: 1px solid var(--line); border-radius: 18px; }
.org.rec { border: 2px solid var(--gold); }
.stars { display: inline-flex; gap: 2px; align-items: center; }
.stars svg { display: block; }
.banner { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #FFF7DD; border: 2px solid var(--gold); border-radius: 18px; }
.banner b { font-size: 17px; font-weight: 800; }
.banner span { font-size: 15px; line-height: 1.4; }
.bn-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.bn-btns a { margin-top: 0 !important; }
.nfs-i .bn-btns a { padding: 10px 14px; border-radius: 12px; background: var(--green); color: #fff; font-size: 15px; font-weight: 800; text-decoration: none; }
.banner a { align-self: flex-start; margin-top: 4px; padding: 8px 14px; border-radius: 12px; background: var(--green); color: #fff; font-size: 15px; font-weight: 800; }
.org .nm { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
.org .cat { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.line { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-width: 0; }
.line svg { flex: none; }
.line span { min-width: 0; overflow-wrap: anywhere; }
.tags { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.tag { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; }
.tag.gold { background: var(--gold); color: var(--ink); }
.tag.mint { background: var(--mint); color: var(--green); }

.empty { padding: 20px 16px; background: var(--white); border: 1px dashed var(--line); border-radius: 18px; display: flex; flex-direction: column; gap: 6px; }
.empty b { font-size: 17px; font-weight: 800; }
.empty span { font-size: 14px; line-height: 1.4; color: var(--muted); }

.photo { display: flex; align-items: center; justify-content: center; height: 130px; border-radius: 18px; background: #DDEFE2; border: 1px dashed #8FBF9B; color: #2F6B45; font-size: 15px; font-weight: 700; text-align: center; padding: 0 12px; }
.title-block { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.title-block h1 { font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.panel { display: flex; flex-direction: column; gap: 14px; padding: 16px; background: var(--white); border: 1px solid var(--line); border-radius: 18px; }
.panel .it { display: flex; align-items: flex-start; gap: 12px; font-size: 16px; }
.panel .it svg { flex: none; margin-top: 1px; }
.panel .it span { min-width: 0; overflow-wrap: anywhere; }
.phone-t { font-variant-numeric: tabular-nums; }
.pricelink { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; background: var(--white); border: 2px solid var(--green); border-radius: 16px; }
.pricelink .t { display: flex; flex-direction: column; gap: 2px; }
.pricelink .t b { font-size: 17px; font-weight: 800; }
.pricelink .t span { font-size: 13px; color: var(--muted); }
.web h2 { font-size: 16px; margin-bottom: 10px; }
.quotes { display: flex; flex-direction: column; gap: 10px; }
.q { margin: 0; padding: 12px 14px; background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; }
.q p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
.q cite { font-size: 13px; font-style: normal; font-weight: 700; color: var(--muted); }
.web .links { display: flex; flex-wrap: wrap; gap: 10px; }
.web a { display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--white); border: 1px solid var(--line); font-size: 15px; font-weight: 700; color: var(--green); }
.actions { margin-top: auto; display: flex; gap: 12px; }
.btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; font-size: 17px; font-weight: 800; border: 2px solid var(--green); }
.btn.fill { background: var(--green); color: var(--white); }
.btn.line2 { background: var(--white); color: var(--green); }

.prices { display: flex; flex-direction: column; background: var(--white); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.prices .pr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--rule); }
.prices .pr:last-child { border-bottom: 0; }
.prices .pr span:first-child { font-size: 16px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.prices .pr span:last-child { font-size: 16px; font-weight: 800; color: var(--green); white-space: nowrap; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; line-height: 1.4; color: var(--muted); }
.foot { margin-top: auto; text-align: center; font-size: 13px; color: var(--muted); }

.soon { margin-top: 16px; padding: 16px; border: 2px dashed var(--ink); border-radius: 18px; background: #F1F7F3; display: flex; flex-direction: column; gap: 4px; }
.soon .badge { align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.soon b { font-size: 17px; font-weight: 800; line-height: 1.25; color: var(--ink); }
.soon span { font-size: 14px; line-height: 1.4; color: #3F5A49; }
.owner { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px; background: var(--ink); color: var(--white); border-radius: 18px; }
.owner .tt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.owner b { font-size: 16px; font-weight: 800; line-height: 1.25; }
.owner span { font-size: 14px; line-height: 1.35; color: #BFD3C6; }
.owner button { flex: none; min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--gold); color: var(--ink); font-size: 15px; font-weight: 800; cursor: pointer; }
.owner button:focus-visible { outline-color: var(--white); }
.steps { display: flex; flex-direction: column; gap: 12px; }
.steps p { margin: 0; font-size: 16px; line-height: 1.45; }
.contact { padding: 14px 16px; border-radius: 14px; background: var(--mint); color: var(--green); font-weight: 800; overflow-wrap: anywhere; }
.install { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px; background: var(--mint); border: 1px solid #BFDCC8; border-radius: 18px; }
.install .tt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.install b { font-size: 16px; font-weight: 800; line-height: 1.25; }
.install span { font-size: 14px; line-height: 1.35; color: var(--muted); }
.install button { flex: none; min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--green); color: var(--white); font-size: 15px; font-weight: 800; cursor: pointer; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); color: var(--ink); font-size: 16px; font-weight: 800; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--white); border-color: var(--green); }
.how { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.how li { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--white); border: 1px solid var(--line); border-radius: 16px; font-size: 16px; line-height: 1.4; }
.how li::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: var(--white); font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; }
.how li div { min-width: 0; overflow-wrap: anywhere; }
.how .ic { display: inline-flex; vertical-align: -6px; }
.bigbtn { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 16px; font-size: 17px; font-weight: 800; border: 2px solid var(--green); background: var(--green); color: var(--white); cursor: pointer; }
.sheet-bg { position: fixed; inset: 0; background: rgba(11, 36, 23, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { width: 100%; max-width: 480px; background: var(--white); border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-size: 22px; }
.sheet p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--muted); }
.sheet .opt { min-height: 60px; border-radius: 16px; border: 2px solid var(--green); background: var(--white); color: var(--green); font-size: 17px; font-weight: 800; cursor: pointer; padding: 0 16px; }
.sheet .opt.fill { background: var(--green); color: var(--white); }
.sheet .skip { border: 0; background: none; color: var(--muted); font-size: 14px; min-height: 44px; cursor: pointer; text-decoration: underline; }
[hidden] { display: none !important; }
.gal { position: relative; }
.gal-s { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 18px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.gal-s::-webkit-scrollbar { display: none; }
.gal-s img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; scroll-snap-align: start; border-radius: 18px; background: var(--mint); }
.gal-b { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(11,36,23,.6); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 0 3px; }
.gal-p { left: 8px; }
.gal-x { right: 8px; }
.gal-n { position: absolute; right: 10px; bottom: 10px; padding: 3px 10px; border-radius: 999px; background: rgba(11,36,23,.7); color: #fff; font-size: 13px; font-weight: 700; }
.top-blocks { display: flex; flex-direction: column; gap: 10px; }
.top-blocks[data-empty] { display: none; }
.idpill { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 8px 14px; border-radius: 14px; background: var(--ink); color: var(--white); border: 0; font-size: 15px; cursor: pointer; text-align: left; width: 100%; }
.idpill b { white-space: nowrap; color: var(--gold); font-size: 16px; letter-spacing: .03em; }
.ncar { display: flex; flex-direction: column; gap: 8px; }
.ntrack { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-radius: 18px; }
.ntrack::-webkit-scrollbar { display: none; }
.nslide { position: relative; flex: 0 0 100%; scroll-snap-align: center; min-height: 200px; border: 0; border-radius: 18px; overflow: hidden; padding: 0; cursor: pointer; text-align: left; color: #fff; background: var(--green); display: flex; align-items: flex-end; }
.nslide.n-gold { background: #8a6a00; }
.nslide.n-mint { background: #1f7a52; }
.nslide .nbg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.nslide.has-img { flex-direction: column; align-items: stretch; min-height: 0; }
.nslide.has-img .nbg { position: relative; inset: auto; width: 100%; aspect-ratio: 16 / 9; flex: none; }
.nslide.has-img .nsh { display: none; }
.nslide.has-img .ntx { padding: 12px 16px 14px; }
.nslide.has-img .ntt { text-shadow: none; font-size: 18px; }
.nslide .nsh { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.05) 100%); }
.nslide .ntx { position: relative; width: 100%; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.nslide .ntag { align-self: flex-start; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--gold); color: var(--ink); }
.nslide .ntt { font-size: 20px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.nslide .nto { font-size: 14px; opacity: .92; }
.ndots { display: flex; justify-content: center; align-items: center; gap: 7px; min-height: 14px; }
.ndots i { width: 8px; height: 8px; border-radius: 50%; background: #B9C7BF; transition: width .2s, background .2s; }
.ndots i.on { width: 22px; border-radius: 6px; background: var(--green); }
.nall { align-self: center; background: none; border: 0; color: var(--green); font-weight: 800; font-size: 15px; min-height: 40px; cursor: pointer; }
.nimg { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 8px; }
.newscard { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: var(--white); border: 2px solid var(--gold); border-radius: 18px; text-align: left; cursor: pointer; width: 100%; color: var(--ink); }
.nc-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.nc-t { font-size: 17px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.nc-m { font-size: 14px; color: var(--green); font-weight: 700; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #D93025; margin-left: 6px; vertical-align: middle; }
.nt { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #E6EBE8; color: var(--ink); }
.nt.gold { background: var(--gold); }
.nt.mint { background: var(--mint); color: var(--green); }
.nitem { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--white); border: 1px solid var(--line); border-radius: 18px; }
.nitem .nm2 { font-size: 18px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.nitem p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }
.nitem .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.idbox { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 16px; background: var(--ink); color: var(--white); border-radius: 18px; text-align: center; }
.idbig { font-size: 34px; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
.chk { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.chk li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; }
.chk li::before { content: "✓"; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--mint); color: var(--green); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.ownlinks { display: flex; flex-direction: column; gap: 10px; }
.ownlinks a { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; font-size: 17px; font-weight: 800; border: 2px solid var(--green); background: var(--white); color: var(--green); }
.ownlinks a.fill { background: var(--green); color: var(--white); }
.fld:focus-within { outline: none; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld b { font-size: 15px; font-weight: 800; }
.fld span { font-size: 13px; color: var(--muted); }
.fld input, .fld textarea { width: 100%; min-height: 52px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; background: var(--white); color: var(--ink); }
.fld textarea { min-height: 120px; resize: vertical; }
.fld input:focus, .fld textarea:focus { outline: 3px solid var(--green); outline-offset: 1px; border-color: var(--green); }
.faq { display: flex; flex-direction: column; gap: 8px; }
.faq details { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
.faq summary { min-height: 52px; display: flex; align-items: center; font-size: 16px; font-weight: 800; cursor: pointer; }
.faq p { margin: 0 0 14px; font-size: 15px; line-height: 1.45; }
.formmsg { padding: 12px 14px; border-radius: 14px; background: var(--mint); color: var(--green); font-weight: 800; font-size: 15px; }
.formmsg.err { background: #FDECEA; color: #8A1C12; }
.help-link { display: block; width: 100%; min-height: 44px; border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; }

:root { --tb: 62px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--white); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--tb); padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.tabbar button.on { color: var(--green); }
.tabbar button.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--green); }
.tabbar .nd { position: absolute; top: 8px; left: calc(50% + 6px); width: 9px; height: 9px; border-radius: 50%; background: #D93025; border: 2px solid var(--white); box-sizing: content-box; }
button.soon { width: 100%; text-align: left; font: inherit; cursor: pointer; }
.soon.big { margin-top: 0; padding: 22px 18px; gap: 10px; }
.soon.big b { font-size: 22px; }
.soon.big span { font-size: 16px; }
.app.news-full { padding: 0; gap: 0; max-width: 480px; min-height: 0; }
.nfs { height: calc(100vh - var(--tb)); height: calc(100dvh - var(--tb) - env(safe-area-inset-bottom)); overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; }
.nfs-i { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; background: var(--white); }

  var cpk = e.target.closest("[data-cphpick]");
  if (cpk) { var cfi = document.getElementById("cp_file"); if (cfi) cfi.click(); return; }
  var crm = e.target.closest("[data-cphrm]");
  if (crm) { CABRM = crm.getAttribute("data-cphrm"); cabPhRedraw(); return; }
  if (e.target.closest("[data-cphno]")) { CABRM = ""; cabPhRedraw(); return; }
  if (e.target.closest("[data-cphyes]")) { cabPhDel(); return; }
  var cbn = e.target.closest("[data-cab]");
  if (cbn) { cabClick(cbn); return; }
  var cl = e.target.closest("[data-copylink]");
  if (cl) { var u = "https://buguruslan56.ru"; try { navigator.clipboard.writeText(u).then(function () { cl.textContent = "Ссылка скопирована ✓"; }, function () { cl.textContent = u; }); } catch (er) { cl.textContent = u; } return; }
  var cp = e.target.closest("[data-copyid]");
  if (cp) { try { navigator.clipboard.writeText(getId()).then(function () { cp.textContent = "Скопировано ✓"; }, function () {}); } catch (er) {} return; }
  var ro = e.target.closest("[data-role]");
  if (ro) { setRole(ro.getAttribute("data-role")); return; }
  var pl = e.target.closest("[data-plat]");
  if (pl) { state.plat = pl.getAttribute("data-plat"); render(); return; }
  var ins = e.target.closest("[data-install]");
  if (ins && deferredPrompt) {
    track("install_click");
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; render(); }, function () {});
    return;
  }
  var b = e.target.closest("[data-back]");
  if (b) { e.preventDefault(); back(); return; }
  var g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
  var a = e.target.closest("a[href]");
  if (a) {
    var h = a.getAttribute("href") || "", org = a.getAttribute("data-org") || currentOrg();
    if (a.hasAttribute("data-ask")) track("item_ask", { org: org });
    else if (a.hasAttribute("data-k")) track("owner_contact");
    else if (h.indexOf("tel:") === 0) track("call_click", { org: org });
    else if (h.indexOf("yandex.ru/maps") !== -1) track("route_click", { org: org });
    else if (a.closest(".web")) track("link_click", { org: org });
  }
});
document.addEventListener("change", function (e) {
  if (e.target.id === "q") { histAdd(e.target.value); return; }
  if (e.target.id === "ad_cat") { adRefresh(); return; }
  if (e.target.id === "cs_file") { var cf = e.target.files[0]; e.target.value = ""; if (cf) cstFile(cf); return; }
  if (e.target.id === "cs_vfile") { var vf1 = e.target.files[0]; e.target.value = ""; if (vf1) cstVideo(vf1); return; }
  if (e.target.id === "cs_logo") { var lf = e.target.files[0]; e.target.value = ""; if (lf) cstLogo(lf); return; }
  if (e.target.id === "csh_file") { var sfl = Array.prototype.slice.call(e.target.files); e.target.value = ""; if (sfl.length) cabShopPhotos(sfl); return; }
  if (e.target.id === "cp_file") { var cfl = Array.prototype.slice.call(e.target.files); e.target.value = ""; if (cfl.length) cabPhUpload(cfl); return; }
  if (e.target.id !== "ad_file" || !e.target.files.length) return;
  var files = Array.prototype.slice.call(e.target.files), chain = Promise.resolve();
  files.forEach(function (f) { chain = chain.then(function () { if (adPh.length >= 3) return; return adShrink(f).then(function (b) { adPh.push(b); }, function () {}); }); });
  chain.then(function () { e.target.value = ""; adRefresh(); });
});
window.addEventListener("hashchange", function () {
  var r = location.hash.slice(1) || "home";
  if (r === state.route) return;
  if (!valid(r)) r = "home";
  if (state.stack.length && state.stack[state.stack.length - 1] === r) state.stack.pop(); else if (r !== "home") state.stack.push(state.route);
  state.route = r;
  render();
});

window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  deferredPrompt = e;
  if (parse(state.route).v === "install") render();
});
window.addEventListener("appinstalled", function () { sset("b56_inst", "1"); track("install"); });

(function start() {
  var r = "home";
  try { r = location.hash.slice(1) || "home"; } catch (e) {}
  loadPlaces();
  loadGoods();
  loadStories();
  loadAds();
  loadBanners();
  loadUrgent();
  state.route = valid(r) ? r : "home";
  var src = qrSource();
  if (src) { if (!sget("b56_src")) sset("b56_src", src); track("qr_open"); }
  if (isStandalone()) {
    track("open_from_icon");
    if (!sget("b56_inst")) { sset("b56_inst", "1"); track("install"); }
  } else if (src && state.route === "home") {
    state.stack = ["home"];
    state.route = "install";
  }
  loadNews();
  render();
  if (getRole()) ensureId();
  try { if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
})();
</script>
