* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

.btn.alt { background:#fff; color:var(--green); }
.btn.red { background:#fff; color:var(--red); border-color:var(--red); }
.btn.sm { min-height:44px; font-size:15px; }
.btn[disabled] { opacity:.5; }
.tabs { display:flex; flex-wrap:wrap; gap:8px; }

.msg { padding:12px 14px; border-radius:12px; font-size:15px; background:var(--mint); color:var(--green); font-weight:700; }
.msg.err { background:#FBE4E2; color:var(--red); }
.check { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; flex-direction:row; }
.check input { width:24px; height:24px; flex:none; }
.nt { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:800; background:#E6EBE8; }
.nt.gold { background:var(--gold); } .nt.mint { background:var(--mint); color:var(--green); }
.ni { border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:6px; background:#fff; }
.ni b { overflow-wrap:anywhere; }
.ni p { margin:0; font-size:15px; overflow-wrap:anywhere; white-space:pre-line; }
.ni .m { font-size:13px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { background:var(--mint); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:2px; }
.tile b { font-size:26px; color:var(--green); line-height:1.1; } .tile span { font-size:13px; color:var(--muted); }
.bars { display:flex; align-items:flex-end; gap:4px; height:110px; padding-top:6px; }
.bars div { flex:1; background:var(--green); border-radius:4px 4px 0 0; min-height:2px; position:relative; }
.bars div i { position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:10px; font-style:normal; color:var(--muted); }
.bl { display:flex; gap:4px; font-size:10px; color:var(--muted); } .bl span { flex:1; text-align:center; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:700; }
td.n, th.n { text-align:right; white-space:nowrap; }
.scroll { overflow-x:auto; }
.win { font-size:30px; font-weight:800; color:var(--green); text-align:center; letter-spacing:.04em; padding:8px; background:var(--mint); border-radius:14px; }
.note { font-size:13px; color:var(--muted); line-height:1.4; }

  if (t.dataset.demo) { login(t.dataset.demo, false); return; }
  if (t.dataset.tab) { TAB = t.dataset.tab; MSG = null; WIN = null; EDIT = null; BEDIT = null; STARS = []; FRESH = true; loadTab(); return; }
  if (t.dataset.tdone) { call({ a: "ticket_done", pw: PW, id: t.dataset.tdone, done: t.dataset.tval === "1" }).then(function (r) { if (!r.ok) afterAuthFail(r); loadTab(); }); return; }
  if (t.dataset.out) { PW = ""; ROLE = ""; MSG = null; sdel("b56_adm"); draw(); return; }
  if (t.dataset.edit) { var pid = Number(t.dataset.edit); EDIT = PLACES.filter(function (x) { return x.id === pid; })[0] || null; STARS = (EDIT && EDIT.stars) ? [].concat(EDIT.stars) : []; FRESH = true; MSG = null; draw(); window.scrollTo(0, 0); return; }
  if (t.dataset.delph && EDIT) { var pid2 = EDIT.id, ff = t.dataset.delph; call({ a: "photo_del", pw: PW, id: pid2, fid: ff }).then(function (r) { if (!r.ok) say(r.err || "Ошибка", true); return call({ a: "places_list", pw: PW }); }).then(function (r) { if (r.ok) { PLACES = r.items; EDIT = PLACES.filter(function (x) { return x.id === pid2; })[0] || null; } FRESH = false; draw(); }); return; }
  if (t.dataset.newp) { EDIT = null; STARS = []; FRESH = true; draw(); return; }
  if (t.dataset.star) { var sn = Number(t.dataset.star), si = STARS.indexOf(sn); if (si >= 0) STARS.splice(si, 1); else STARS.push(sn); FRESH = false; draw(); return; }
  if (t.dataset.bedit) { var bc = t.dataset.bedit; BEDIT = BANNERS.filter(function (x) { return x.cat === bc; })[0] || null; FRESH = true; MSG = null; draw(); window.scrollTo(0, 0); return; }
  if (t.dataset.bnew) { BEDIT = null; FRESH = true; draw(); return; }
  if (t.dataset.askdelb) { BDEL = t.dataset.askdelb; draw(); return; }
  if (t.dataset.delb) { var bd = t.dataset.delb; BDEL = ""; call({ a: "banner_del", pw: PW, cat: bd }).then(function (r) { if (r.ok) { say("Плашка убрана."); BEDIT = null; FRESH = true; } else afterAuthFail(r); loadTab(); }); return; }
  if (t.dataset.askdelp) { PDEL = t.dataset.askdelp; draw(); return; }
  if (t.dataset.delp) { var pd = t.dataset.delp; PDEL = ""; call({ a: "place_del", pw: PW, id: Number(pd) }).then(function (r) { if (r.ok) say("Убрано из приложения."); else afterAuthFail(r); loadTab(); }); return; }
  if (t.dataset.askdel) { PENDING_DEL = t.dataset.askdel; draw(); return; }
  if (t.dataset.nodel) { PENDING_DEL = ""; draw(); return; }
  if (t.dataset.del) { var id = t.dataset.del; PENDING_DEL = ""; call({ a: "news_del", pw: PW, id: id }).then(function (r) { if (r.ok) say("Убрано. Из приложения пропадёт при следующем открытии."); else afterAuthFail(r); loadTab(); }); }
});

draw();
(function () { var p = sget("b56_adm"); if (p && !DEMO) login(p, true); })();
</script>
