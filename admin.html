<style>
:root { --bg:#F2F7F3; --ink:#0B2417; --green:#14532D; --line:#CFE0D5; --muted:#4D6657; --gold:#FFD166; --mint:#DCEFE2; --white:#fff; --red:#B3261E;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); overflow-x:hidden; }

label { display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:700; }

.btn { min-height:52px; border-radius:14px; border:2px solid var(--green); background:var(--green); color:#fff; font:inherit; font-size:17px; font-weight:800; cursor:pointer; padding:0 18px; }
.btn.alt { background:#fff; color:var(--green); }
.btn.red { background:#fff; color:var(--red); border-color:var(--red); }
.btn.sm { min-height:46px; font-size:15px; }
.btn[disabled] { opacity:.5; }
.row2 { display:flex; gap:8px; flex-wrap:wrap; } .row2 > * { flex:1 1 140px; }
.msg { padding:12px 14px; border-radius:12px; font-size:15px; background:var(--mint); color:var(--green); font-weight:700; }
.msg.err { background:#FBE4E2; color:var(--red); }
.check { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; flex-direction:row; min-height:44px; }

th, td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }

.win { font-size:30px; font-weight:800; color:var(--green); text-align:center; letter-spacing:.04em; padding:8px; background:var(--mint); border-radius:14px; }
.note { font-size:13px; color:var(--muted); line-height:1.4; }

.bnav { position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fff; border-top:1px solid var(--line); display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom); }

a.btn { display:flex; align-items:center; justify-content:center; text-decoration:none; }

.ib0 { flex:none; width:46px; height:46px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--green); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }

.blk { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }

.hrs input[type="time"] { padding: 4px 4px; font-size: 15px; }

  if (d.stedit) { var sx = STO.items.filter(function (x) { return x.id === Number(d.stedit); })[0]; STO.edit = sx ? JSON.parse(JSON.stringify(sx)) : null; if (STO.edit) { STO.edit.vid = ""; STO.edit.rmv = false; STO.edit.rmc = false; } MSG = null; draw(); window.scrollTo(0, 0); return; }
  if (d.stcancel) { STO.edit = null; draw(); return; }
  if (d.stask) { STO.rm = Number(d.stask); draw(); return; }
  if (d.stno) { STO.rm = 0; draw(); return; }
  if (d.stcopy) { stCopy(d.stcopy); return; }
  if (d.stact) {
    var sa = d.stact, sid = Number(d.stid), so = { id: sid, act: sa };
    if (sa === "move") so.dir = Number(d.stdir);
    if (sa === "reject") { var rs0 = document.getElementById("strs" + sid); so.reason = rs0 && rs0.value.trim() ? rs0.value.trim() : "Не прошла проверку"; }
    if (sa !== "move" && sa !== "extend") IOPEN = "";
    stDo(so, sa === "approve" ? "Опубликовано." : sa === "paid" ? "Оплата отмечена, история опубликована." : sa === "reject" ? "Отклонено." : sa === "remove" ? "Снято, история в архиве." : sa === "extend" ? "Продлено на сутки." : sa === "del" ? "Удалено." : ""); return;
  }
  if (d.stcfg) { call({ a: "story_cfg", pw: PW, set: true, price: val("stcp"), limit: val("stcl"), partners: document.getElementById("stcw").checked }).then(function (r) { if (!r.ok) say(r.err || "Ошибка", true); else say("Настройки историй сохранены.", false); stLoad(); }); return; }
  if (d.lgdel && ED && ED.id) { var lg0 = ED.id; readDraft(); call({ a: "logo_set", pw: PW, id: lg0, clear: true }).then(function (r) { if (!r.ok) say(r.err || "Ошибка", true); else say("Логотип убран.", false); return call({ a: "places_list", pw: PW }); }).then(function (r) { if (r.ok) { PLACES = r.items; var n = PLACES.filter(function (x) { return x.id === lg0; })[0]; if (n && ED && ED.id === lg0) { ED.logo = ""; ED.logoId = ""; } } if (ED) { ED.open.photo = true; draw(true); } }); return; }
  /* публикации */
  if (d.pub) { PUB = d.pub; MSG = null; draw(); return; }
  if (d.unew) { UED = { id: 0, g: "emerg", name: "", note: "", phones: [], addr: "", hours: "", h24: false, kw: "", memo: "", hidden: false }; MSG = null; draw(); window.scrollTo(0, 0); return; }
  if (d.uedit) { var ue = Number(d.uedit); var ux = URGL.filter(function (x) { return x.id === ue; })[0]; UED = ux ? JSON.parse(JSON.stringify(ux)) : null; MSG = null; draw(); window.scrollTo(0, 0); return; }
  if (d.ucancel) { UED = null; draw(); return; }
  if (d.umove) { call({ a: "urgent_move", pw: PW, id: Number(d.umove), dir: Number(d.udir) }).then(function (r) { if (!r.ok) say(r.err || "Ошибка", true); urgReload(); }); return; }
  if (d.uhide) { var uh = Number(d.uhide); var uy = URGL.filter(function (x) { return x.id === uh; })[0]; if (uy) { var un = JSON.parse(JSON.stringify(uy)); un.hidden = !un.hidden; call({ a: "urgent_save", pw: PW, item: un }).then(function (r) { if (!r.ok) say(r.err || "Ошибка", true); else say(un.hidden ? "Скрыто: жители эту строку не видят." : "Показывается в приложении.", false); urgReload(); }); } return; }
  if (d.uask) { UDEL = Number(d.uask); draw(); return; }
  if (d.uno) { UDEL = 0; draw(); return; }
  if (d.udel) { var ud = Number(d.udel); UDEL = 0; call({ a: "urgent_del", pw: PW, id: ud }).then(function (r) { if (!r.ok) say(r.err || "Ошибка", true); else say("Удалено.", false); urgReload(); }); return; }
  if (d.ucheck) { call({ a: "urgent_check", pw: PW }).then(function (r) { if (!r.ok) say(r.err || "Ошибка", true); else say("Отмечено: всё проверено сегодня.", false); urgReload(); }); return; }
  if (d.bedit) { var bc = d.bedit; BEDIT = BANNERS.filter(function (x) { return x.cat === bc; })[0] || null; MSG = null; draw(); window.scrollTo(0, 0); return; }
  if (d.bnew) { BEDIT = null; draw(); return; }
  if (d.askdelb) { BDEL = d.askdelb; draw(); return; }
  if (d.nobdel) { BDEL = ""; draw(); return; }
  if (d.delb) { var bd = d.delb; BDEL = ""; call({ a: "banner_del", pw: PW, cat: bd }).then(function (r) { if (r.ok) { say("Плашка убрана."); BEDIT = null; } else afterAuthFail(r); loadPub(); }); return; }
  if (d.askdel) { PENDING_DEL = d.askdel; draw(); return; }
  if (d.nodel) { PENDING_DEL = ""; draw(); return; }
  if (d.del) { var nid = d.del; PENDING_DEL = ""; call({ a: "news_del", pw: PW, id: nid }).then(function (r) { if (r.ok) say("Убрано. Из приложения пропадёт при следующем открытии."); else afterAuthFail(r); loadPub(); }); return; }
}
document.addEventListener("click", function (e) {
  var t = e.target.closest && e.target.closest("button"); if (!t || t.closest(".hrs")) return;
  if (!root.contains(t) && !t.closest("#bnav") && !t.closest("#prev")) return;
  doAction(t);
});
document.addEventListener("click", function (e) { var o = e.target; if (o && o.id === "prev") o.parentNode.removeChild(o); });
window.addEventListener("beforeunload", function () { if (ED && EDS && (EDS.dirty || EDS.saving)) { try { doSave(); } catch (e) {} } });

draw();
(function () { var p = sget("b56_adm"); if (p && !DEMO) login(p, true, true); })();
</script>
